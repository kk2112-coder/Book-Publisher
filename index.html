    <!-- JSON-LD Structured Data for Search Engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BookStore",
      "name": "Lumina Press",
      "url": "https://book-publisher-ten.vercel.app/",
      "logo": "https://book-publisher-ten.vercel.app/favicon.svg",

      "sameAs": [
        "https://twitter.com/luminapress",
        "https://github.com/kk2112-coder/Book-Publisher"
      ],
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://book-publisher-ten.vercel.app/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

  <body class="bg-[#07080c] text-slate-100 antialiased selection:bg-orange-500 selection:text-white min-h-screen">
    <div id="root">
      <!-- Semantic Static Pre-Render for SEO Crawlers & Instant FCP -->
      <noscript>
        <div style="padding: 40px; text-align: center; color: #fff; background: #07080c; font-family: sans-serif;">
          <h1>Lumina Press — Modern Book Publisher & Marketplace</h1>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration note:', err));
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
